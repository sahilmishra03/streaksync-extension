<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>StreakSync</title>
    <link rel="stylesheet" href="fonts/fonts.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="shell">
      <header class="top">
        <div class="brand">
          <img src="icons/logo-mark.png" alt="" class="mark" />
          <span>StreakSync</span>
        </div>
        <button class="icon-btn" id="openSettings" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"
            />
          </svg>
        </button>
      </header>

      <!-- First run -->
      <section id="setup" class="hidden">
        <div class="hero">
          <img src="icons/logo-mark.png" alt="" class="hero-mark" />
          <p class="hero-title">Never break your streak</p>
          <p class="hero-sub">Track GitHub, LeetCode and GFG, and get reminded before your streak breaks.</p>
        </div>
        <button id="setupBtn" class="cta">Get started</button>
      </section>

      <!-- Main -->
      <section id="main" class="hidden">
        <div class="hero">
          <div class="big"><span id="doneCount">0</span><span class="slash">/</span><span id="totalCount">0</span></div>
          <div class="hero-label">done today</div>
          <div class="hero-sub" id="summary">Checking...</div>
          <button class="refresh" id="syncNowBtn" title="Check now">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4h-4" /></svg>
            <span>Check now</span>
          </button>
        </div>

        <div class="group-head">
          <span id="todayLabel">Today</span>
          <span>Checked <b id="checkedAt">-</b></span>
        </div>
        <div id="platforms" class="list"></div>
      </section>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
