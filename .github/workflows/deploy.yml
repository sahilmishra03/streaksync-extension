# After CI passes on main: deploys the API (Cloudflare Worker) and, if configured, the website (Vercel).
# The website build packs the latest extension zip, so the Download button always serves the newest version.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   token with "Workers Scripts: Edit" and "Workers KV Storage: Edit"
#   CLOUDFLARE_ACCOUNT_ID  82376e1ee0ea4e591f162ee5c654d33f
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID   (optional; skip if Vercel's Git integration deploys)
# Worker secrets (GitHub/Brevo keys) are NOT set here; they stay in Cloudflare.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  worker:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Deploy worker
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "No Cloudflare token, skipping."; exit 0; fi
          cd worker && npx wrangler deploy

  website:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deploy website to Vercel
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "No Vercel token, skipping (Vercel Git integration can deploy instead)."; exit 0; fi
          npx --yes vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token "$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN"
